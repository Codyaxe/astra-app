# Firebase Data Connect Schema (Cloud SQL for PostgreSQL)
# Types with @table and foreign key relations only. No business rules.

type Member @table {
  id: String! @default(expr: "uuidV4()")
  studentId: String!
  email: String!
  fullName: String!
  isPaid: Boolean!
  role: String!
  createdAt: Timestamp! @default(expr: "requestTime")
}

type Partner @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  description: String
  logoUrl: String
  createdAt: Timestamp! @default(expr: "requestTime")
}

type Perk @table {
  id: String! @default(expr: "uuidV4()")
  partner: Partner!
  title: String!
  description: String
  pointsCost: Int!
  isActive: Boolean!
  createdAt: Timestamp! @default(expr: "requestTime")
}

type Event @table {
  id: String! @default(expr: "uuidV4()")
  title: String!
  description: String
  pointsValue: Int!
  eventDate: Timestamp!
  createdAt: Timestamp! @default(expr: "requestTime")
}

type Attendance @table {
  id: String! @default(expr: "uuidV4()")
  member: Member!
  event: Event!
  checkInAt: Timestamp! @default(expr: "requestTime")
}

type PointsLedger @table {
  id: String! @default(expr: "uuidV4()")
  member: Member!
  amount: Int!
  reason: String!
  grantedBy: String
  createdAt: Timestamp! @default(expr: "requestTime")
}

type Voucher @table {
  id: String! @default(expr: "uuidV4()")
  member: Member!
  perk: Perk!
  code: String!
  isRedeemed: Boolean!
  redeemedAt: Timestamp
  createdAt: Timestamp! @default(expr: "requestTime")
}
