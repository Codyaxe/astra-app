# Example mutation for SDK generation
mutation CreateEvent(
  $title: String!
  $description: String
  $pointsValue: Int!
  $eventDate: Timestamp!
) @auth(level: PUBLIC) {
  event_insert(
    data: {
      title: $title
      description: $description
      pointsValue: $pointsValue
      eventDate: $eventDate
    }
  )
}

